# Prometheus scrape configuration for Workshop 3.
# The consumer runs on the HOST and exposes /metrics on port 8000.
#   - Podman:  host.containers.internal resolves automatically
#   - Docker:  compose adds extra_hosts: host.containers.internal:host-gateway
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: happiness-ml-consumer
    static_configs:
      - targets: ["host.containers.internal:8000"]
        labels:
          app: happiness-consumer
